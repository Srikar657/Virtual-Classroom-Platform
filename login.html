<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Virtual Classroom</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header>

        <div class="logo">
            Virtual Classroom
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </nav>

    </header>


    <!-- Login Section -->
    <section class="auth-section">

        <div class="auth-container">

            <h1>
                Login
            </h1>

            <p class="auth-subtitle">
                Login to access your virtual classroom
            </p>


            <!-- Login Form -->
            <form id="loginForm">

                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- User Type -->
                <div class="form-group">

                    <label for="userType">
                        Login As
                    </label>

                    <select id="userType" name="userType" required>

                        <option value="">
                            Select User Type
                        </option>

                        <option value="student">
                            Student
                        </option>

                        <option value="teacher">
                            Teacher
                        </option>

                    </select>

                </div>


                <!-- Remember Me -->
                <div class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    <label for="remember">
                        Remember me
                    </label>

                </div>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="btn primary-btn login-btn"
                >
                    Login
                </button>

            </form>


            <!-- Register Link -->
            <p class="auth-link">

                Don't have an account?

                <a href="register.html">
                    Register here
                </a>

            </p>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 Virtual Classroom Platform
        </p>

        <p>
            Agile/Scrum Simulation using Git & GitHub
        </p>

    </footer>


    <!-- Login JavaScript -->
    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value;

                const password =
                    document.getElementById("password").value;

                const userType =
                    document.getElementById("userType").value;


                if (
                    email === "" ||
                    password === "" ||
                    userType === ""
                ) {

                    alert("Please fill all fields.");

                    return;
                }


                /*
                 * This is a frontend demonstration.
                 * A real project would verify the
                 * credentials using a backend/database.
                 */

                if (userType === "student") {

                    alert(
                        "Student login successful!"
                    );

                    window.location.href =
                        "live-class.html";

                }

                else if (userType === "teacher") {

                    alert(
                        "Teacher login successful!"
                    );

                    window.location.href =
                        "create-class.html";

                }

            });

    </script>

</body>

</html>
