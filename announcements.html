<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Announcements - Virtual Classroom</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .announcement-section {
            min-height: calc(100vh - 150px);

            padding: 50px 8%;

            background: #f4f7fb;
        }


        .page-title {
            text-align: center;

            color: #1e3a8a;

            margin-bottom: 10px;

            font-size: 36px;
        }


        .page-description {
            text-align: center;

            color: #666;

            margin-bottom: 40px;
        }


        .announcement-container {
            max-width: 1000px;

            margin: auto;
        }


        /* Create Announcement */

        .create-announcement {
            background: white;

            padding: 30px;

            border-radius: 15px;

            margin-bottom: 35px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.08);
        }


        .create-announcement h2 {
            color: #1e3a8a;

            margin-bottom: 20px;
        }


        /* Announcement List */

        .announcement-list h2 {
            color: #1e3a8a;

            margin-bottom: 20px;
        }


        .announcement-card {
            background: white;

            padding: 25px;

            border-radius: 12px;

            margin-bottom: 20px;

            border-left: 5px solid #2563eb;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.07);

            transition: 0.3s;
        }


        .announcement-card:hover {
            transform: translateY(-3px);

            box-shadow:
                0 8px 20px
                rgba(0, 0, 0, 0.10);
        }


        .announcement-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 12px;
        }


        .announcement-title {
            color: #1e3a8a;

            font-size: 21px;

            font-weight: bold;
        }


        .announcement-date {
            color: #888;

            font-size: 13px;
        }


        .announcement-teacher {
            color: #2563eb;

            font-size: 14px;

            font-weight: bold;

            margin-bottom: 10px;
        }


        .announcement-text {
            color: #555;

            line-height: 1.7;

            margin-bottom: 15px;

            white-space: pre-wrap;
        }


        .delete-btn {
            background: #dc2626;

            color: white;

            border: none;

            padding: 8px 14px;

            border-radius: 6px;

            cursor: pointer;

            font-weight: bold;
        }


        .delete-btn:hover {
            background: #b91c1c;
        }


        .empty-message {
            background: white;

            padding: 45px;

            text-align: center;

            border-radius: 12px;

            color: #666;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.06);
        }


        .important {
            border-left-color: #dc2626;
        }


        .important-label {
            display: inline-block;

            background: #fee2e2;

            color: #b91c1c;

            padding: 5px 10px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;

            margin-bottom: 10px;
        }


        @media (max-width: 700px) {

            .announcement-section {
                padding: 30px 5%;
            }


            .announcement-header {
                flex-direction: column;

                align-items: flex-start;

                gap: 8px;
            }

        }

    </style>

</head>


<body>


    <!-- Navigation Bar -->

    <header>

        <div class="logo">
            Virtual Classroom
        </div>


        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="live-class.html">
                Live Classes
            </a>

            <a href="download-notes.html">
                Notes
            </a>

            <a href="discussion.html">
                Discussion
            </a>

            <a href="announcements.html">
                Announcements
            </a>

            <a href="login.html">
                Logout
            </a>

        </nav>

    </header>


    <!-- Announcements Section -->

    <section class="announcement-section">

        <h1 class="page-title">
            Class Announcements
        </h1>


        <p class="page-description">
            Important information and updates from your teachers.
        </p>


        <div class="announcement-container">


            <!-- Create Announcement -->

            <div class="create-announcement">

                <h2>
                    Post Announcement
                </h2>


                <form id="announcementForm">


                    <!-- Teacher Name -->

                    <div class="form-group">

                        <label for="teacherName">
                            Teacher Name
                        </label>

                        <input
                            type="text"
                            id="teacherName"
                            placeholder="Enter teacher name"
                            required
                        >

                    </div>


                    <!-- Announcement Title -->

                    <div class="form-group">

                        <label for="announcementTitle">
                            Announcement Title
                        </label>

                        <input
                            type="text"
                            id="announcementTitle"
                            placeholder="Example: Assignment Submission"
                            required
                        >

                    </div>


                    <!-- Announcement Type -->

                    <div class="form-group">

                        <label for="announcementType">
                            Announcement Type
                        </label>

                        <select
                            id="announcementType"
                            required
                        >

                            <option value="">
                                Select type
                            </option>

                            <option value="normal">
                                Normal
                            </option>

                            <option value="important">
                                Important
                            </option>

                        </select>

                    </div>


                    <!-- Announcement Content -->

                    <div class="form-group">

                        <label for="announcementText">
                            Announcement
                        </label>

                        <textarea
                            id="announcementText"
                            rows="5"
                            placeholder="Write your announcement here..."
                            required
                        ></textarea>

                    </div>


                    <!-- Submit -->

                    <button
                        type="submit"
                        class="btn primary-btn"
                    >
                        📢 Post Announcement
                    </button>


                </form>

            </div>


            <!-- Announcement List -->

            <div class="announcement-list">

                <h2>
                    Latest Announcements
                </h2>


                <div id="announcementContainer">

                    <!-- Announcements appear here -->

                </div>

            </div>


        </div>

    </section>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 Virtual Classroom Platform
        </p>


        <p>
            Agile/Scrum Simulation using Git & GitHub
        </p>

    </footer>


    <!-- JavaScript -->

    <script>

        const announcementForm =
            document.getElementById(
                "announcementForm"
            );


        const announcementContainer =
            document.getElementById(
                "announcementContainer"
            );


        /*
         * Load announcements
         * from localStorage.
         */

        let announcements =
            JSON.parse(
                localStorage.getItem(
                    "announcements"
                )
            ) || [];


        displayAnnouncements();


        /*
         * Post Announcement
         */

        announcementForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const teacherName =
                    document
                        .getElementById(
                            "teacherName"
                        )
                        .value
                        .trim();


                const title =
                    document
                        .getElementById(
                            "announcementTitle"
                        )
                        .value
                        .trim();


                const type =
                    document
                        .getElementById(
                            "announcementType"
                        )
                        .value;


                const text =
                    document
                        .getElementById(
                            "announcementText"
                        )
                        .value
                        .trim();


                const announcement = {

                    id: Date.now(),

                    teacher:
                        teacherName,

                    title:
                        title,

                    type:
                        type,

                    text:
                        text,

                    date:
                        new Date()
                            .toLocaleString()

                };


                announcements.push(
                    announcement
                );


                saveAnnouncements();


                announcementForm.reset();


                displayAnnouncements();


                alert(
                    "Announcement posted successfully!"
                );

            }
        );


        /*
         * Save announcements
         */

        function saveAnnouncements() {

            localStorage.setItem(
                "announcements",
                JSON.stringify(
                    announcements
                )
            );

        }


        /*
         * Display announcements
         */

        function displayAnnouncements() {

            announcementContainer.innerHTML =
                "";


            if (
                announcements.length === 0
            ) {

                announcementContainer.innerHTML = `

                    <div class="empty-message">

                        <h3>
                            No Announcements
                        </h3>

                        <p>
                            There are no announcements at the moment.
                        </p>

                    </div>

                `;

                return;

            }


            /*
             * Show latest announcement first.
             */

            const sortedAnnouncements =
                [...announcements].reverse();


            sortedAnnouncements.forEach(
                function(announcement) {

                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "announcement-card";


                    if (
                        announcement.type ===
                        "important"
                    ) {

                        card.classList.add(
                            "important"
                        );

                    }


                    let importantLabel = "";


                    if (
                        announcement.type ===
                        "important"
                    ) {

                        importantLabel = `

                            <span class="important-label">
                                ⚠ IMPORTANT
                            </span>

                        `;

                    }


                    card.innerHTML = `

                        ${importantLabel}


                        <div class="announcement-header">

                            <div class="announcement-title">

                                ${announcement.title}

                            </div>


                            <div class="announcement-date">

                                ${announcement.date}

                            </div>

                        </div>


                        <div class="announcement-teacher">

                            👨‍🏫
                            Posted by:
                            ${announcement.teacher}

                        </div>


                        <div class="announcement-text">

                            ${announcement.text}

                        </div>


                        <button
                            class="delete-btn"
                            onclick="deleteAnnouncement(${announcement.id})"
                        >
                            Delete
                        </button>

                    `;


                    announcementContainer.appendChild(
                        card
                    );

                }
            );

        }


        /*
         * Delete Announcement
         */

        function deleteAnnouncement(id) {

            const confirmed =
                confirm(
                    "Are you sure you want to delete this announcement?"
                );


            if (!confirmed) {
                return;
            }


            announcements =
                announcements.filter(
                    function(announcement) {

                        return (
                            announcement.id !== id
                        );

                    }
                );


            saveAnnouncements();


            displayAnnouncements();

        }

    </script>


</body>

</html>
